<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#2c2a29" role="img" aria-label="Échelle de la charge des boues : sous 0,35 la nitrification est possible, de 0,5 à 1 la plage est à éviter pour la décantation ; quand la charge monte, l'âge des boues baisse">
  <rect width="640" height="360" fill="#fff"/>
  <text x="320" y="36" text-anchor="middle" font-size="22" font-weight="700">La charge des boues décide de presque tout</text>
  <rect x="40" y="150" width="189" height="44" fill="#eaf4ea" stroke="#2e7d32" stroke-width="2"/>
  <rect x="229" y="150" width="81" height="44" fill="#f6f7f8" stroke="#897879" stroke-width="2"/>
  <rect x="310" y="150" width="180" height="44" fill="#fbeceb" stroke="#b3261e" stroke-width="2"/>
  <rect x="490" y="150" width="110" height="44" fill="#f6f7f8" stroke="#897879" stroke-width="2"/>
  <text x="134" y="178" text-anchor="middle">Nitrification possible</text>
  <text x="400" y="178" text-anchor="middle">Plage à éviter</text>
  <g text-anchor="middle" font-weight="700">
    <text x="40" y="218">0</text><text x="229" y="218">0,35</text><text x="310" y="218">0,5</text><text x="490" y="218">1</text>
  </g>
  <text x="320" y="248" text-anchor="middle" font-size="15" fill="#5f5556">Charge des boues (kg DBO5/kg de boues par jour) · échelle non linéaire</text>
  <g stroke="#2c2a29" stroke-width="2.5" fill="none">
    <path d="M60 110H580M572 104L580 110L572 116"/>
    <path d="M580 296H60M68 290L60 296L68 302"/>
  </g>
  <text x="320" y="96" text-anchor="middle">La charge augmente : moins de boues pour plus de nourriture</text>
  <text x="320" y="324" text-anchor="middle">L'âge des boues augmente : boues plus stables, peu produites</text>
</svg>
