<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Labo · Épuration</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../img/icone.svg" type="image/svg+xml">
  <script type="module" src="../js/ui/habillage.js"></script>
</head>
<body>
  <main data-bandeau>
    <p class="surtitre">Le labo</p>
    <h1 style="margin-top:0;font-size:clamp(1.7rem,6vw,2.8rem)">Vos outils en direct</h1>
    <p class="intro">Chaque résultat s'appuie sur des valeurs sourcées, avec la page du livre.</p>
    <ul class="grille trois" id="liste-outils" style="margin-top:1rem"></ul>
  </main>
  <script type="module">
    import { OUTILS } from '../js/donnees.js';
    import { carteOutil } from '../js/ui/composants.js';
    document.querySelector('#liste-outils').append(...OUTILS.map((o) => {
      const li = document.createElement('li');
      li.append(carteOutil(o, '../'));
      return li;
    }));
  </script>
</body>
</html>
